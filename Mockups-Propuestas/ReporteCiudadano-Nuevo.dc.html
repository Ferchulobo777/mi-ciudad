<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#1E5A8E} a:hover{color:#163F63}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#F5F6F8;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1E2530;">

  <!-- Header -->
  <div style="background:#1E5A8E;padding:20px 20px 16px;display:flex;align-items:center;gap:14px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span style="color:#FFFFFF;font-size:17px;font-weight:700;">Nuevo reporte</span>
  </div>

  <div style="flex:1;padding:18px 20px;overflow:hidden;display:flex;flex-direction:column;gap:16px;">

    <!-- Que pasa -->
    <div>
      <div style="font-size:13px;font-weight:700;color:#4A5568;margin-bottom:8px;">¿Qué pasa?</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <div style="padding:8px 14px;border-radius:100px;background:#E8792A;color:#FFFFFF;font-size:13px;font-weight:700;">Bache</div>
        <div style="padding:8px 14px;border-radius:100px;background:#FFFFFF;color:#4A5568;font-size:13px;font-weight:600;border:1px solid #DDE2E8;">Luz</div>
        <div style="padding:8px 14px;border-radius:100px;background:#FFFFFF;color:#4A5568;font-size:13px;font-weight:600;border:1px solid #DDE2E8;">Basura</div>
        <div style="padding:8px 14px;border-radius:100px;background:#FFFFFF;color:#4A5568;font-size:13px;font-weight:600;border:1px solid #DDE2E8;">Rama</div>
        <div style="padding:8px 14px;border-radius:100px;background:#FFFFFF;color:#4A5568;font-size:13px;font-weight:600;border:1px solid #DDE2E8;">Agua</div>
        <div style="padding:8px 14px;border-radius:100px;background:#FFFFFF;color:#4A5568;font-size:13px;font-weight:600;border:1px solid #DDE2E8;">Semáforo</div>
      </div>
    </div>

    <!-- Foto -->
    <div>
      <div style="font-size:13px;font-weight:700;color:#4A5568;margin-bottom:8px;">Foto <span style="color:#E8792A;">· obligatoria</span></div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;height:96px;border-radius:14px;border:2px dashed #B8C2CE;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span style="font-size:12px;font-weight:700;color:#1E5A8E;">Tomar foto</span>
        </div>
        <div style="flex:1;height:96px;border-radius:14px;border:1px solid #DDE2E8;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span style="font-size:12px;font-weight:700;color:#4A5568;">Galería</span>
        </div>
      </div>
    </div>

    <!-- Donde -->
    <div>
      <div style="font-size:13px;font-weight:700;color:#4A5568;margin-bottom:8px;">Dónde</div>
      <div style="background:#FFFFFF;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.05);">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span style="font-size:13px;font-weight:600;">Rocamora 1240 · a 12 m</span>
        </div>
        <span style="font-size:12px;font-weight:700;color:#1E5A8E;">Corregir</span>
      </div>
    </div>

    <!-- Contanos -->
    <div>
      <div style="font-size:13px;font-weight:700;color:#4A5568;margin-bottom:8px;">Contanos</div>
      <div style="background:#FFFFFF;border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/></svg>
        <span style="font-size:13px;color:#8A94A3;">Grabar audio o escribir</span>
      </div>
    </div>

  </div>

  <div style="padding:16px 20px 26px;">
    <button style="all:unset;display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:14px;background:#E8792A;color:#FFFFFF;font-size:15px;font-weight:800;letter-spacing:.04em;cursor:pointer;">ENVIAR</button>
  </div>

</div>
</x-dc>
</body>
</html>
