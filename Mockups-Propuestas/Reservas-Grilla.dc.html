<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#2E9E4F} a:hover{color:#1F7538}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#F2F7F2;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1B2420;">

  <div style="background:#2E9E4F;padding:20px 20px 16px;display:flex;align-items:center;gap:14px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span style="color:#FFFFFF;font-size:17px;font-weight:700;">Cancha 2 · Fútbol 5</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" style="margin-left:auto;"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
  </div>

  <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E9E4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span style="font-size:14px;font-weight:800;">Sábado 19 de septiembre</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E9E4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>

  <div style="flex:1;padding:0 20px;overflow:hidden;display:flex;flex-direction:column;gap:8px;">

    <div style="display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border-radius:12px;padding:12px 16px;">
      <span style="font-size:14px;font-weight:700;">19:00</span>
      <span style="font-size:13px;font-weight:700;color:#2E9E4F;">libre</span>
      <span style="font-size:13px;font-weight:800;">$ 12.000</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#EDEDED;border-radius:12px;padding:12px 16px;opacity:.7;">
      <span style="font-size:14px;font-weight:700;color:#6B7570;">18:00</span>
      <span style="font-size:12px;font-weight:800;color:#8A948E;letter-spacing:.03em;">OCUPADO</span>
      <span style="font-size:13px;color:#8A948E;">—</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#FDECE3;border-radius:12px;padding:12px 16px;">
      <span style="font-size:14px;font-weight:700;color:#B14B1E;">20:00</span>
      <span style="font-size:12px;font-weight:800;color:#F26A21;letter-spacing:.03em;">MANTENIMIENTO</span>
      <span style="font-size:13px;color:#B14B1E;">—</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#E8EEF5;border-radius:12px;padding:12px 16px;">
      <span style="font-size:14px;font-weight:700;color:#1B3A5C;">21:00</span>
      <span style="font-size:12px;font-weight:800;color:#1B3A5C;letter-spacing:.03em;">FIJO · Grupo del martes</span>
      <span style="font-size:13px;color:#1B3A5C;">—</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border-radius:12px;padding:12px 16px;border:2px solid #2E9E4F;">
      <span style="font-size:14px;font-weight:700;">22:00</span>
      <span style="font-size:13px;font-weight:700;color:#2E9E4F;">libre</span>
      <span style="font-size:13px;font-weight:800;">$ 12.000</span>
    </div>

  </div>

  <div style="padding:16px 20px 26px;">
    <button style="all:unset;display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:14px;background:#F26A21;color:#FFFFFF;font-size:15px;font-weight:800;letter-spacing:.04em;">RESERVAR</button>
  </div>

</div>
</x-dc>
</body>
</html>
