<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#0B6E8C} a:hover{color:#084C63}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <!-- Photo -->
  <div style="height:280px;position:relative;background:linear-gradient(150deg,#8E5A4A 0%,#5C3B30 100%);flex-shrink:0;">
    <svg width="100%" height="100%" viewBox="0 0 390 280" style="position:absolute;inset:0;opacity:.5;">
      <circle cx="120" cy="200" r="70" fill="#5C3B30"/>
      <rect x="60" y="120" width="14" height="90" fill="#3D2620"/>
      <path d="M67 60 L67 140 M67 100 L30 60 M67 100 L104 60 M67 100 L30 140 M67 100 L104 140" stroke="#3D2620" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;top:20px;left:20px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div style="position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#D96C3F" stroke="#D96C3F" stroke-width="1.5"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
    </div>
  </div>

  <div style="flex:1;padding:20px 22px;overflow:hidden;">
    <div style="display:inline-block;background:#F1E7DE;color:#8E5A4A;font-size:12px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:10px;">Museos y patrimonio</div>
    <div style="font-size:24px;font-weight:800;margin-bottom:8px;">Molino Forclaz</div>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:6px;color:#3F8F5B;font-size:13px;font-weight:700;">
        <span style="width:8px;height:8px;border-radius:50%;background:#3F8F5B;display:inline-block;"></span>
        Abierto ahora · cierra 19:00
      </div>
    </div>
    <div style="font-size:13px;color:#5C6B6E;margin-bottom:16px;">A 4,2 km de donde estás</div>

    <div style="font-size:14px;line-height:1.6;color:#3A4548;margin-bottom:22px;">
      Construido en 1888 por la familia Forclaz, colonos suizos que se instalaron sobre la
      barranca del río Uruguay. Hoy funciona como museo y mirador de la costanera.
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:#0B6E8C;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Escuchar audioguía · 4:12
      </button>
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:#F1EDE4;color:#1F2A2E;font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Cómo llegar
      </button>
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;border:2px solid #D96C3F;color:#D96C3F;font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D96C3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Registrar visita
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
