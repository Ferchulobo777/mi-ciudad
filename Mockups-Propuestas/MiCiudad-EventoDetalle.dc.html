<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;} *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <div style="height:220px;position:relative;background:linear-gradient(150deg,#3F7D45 0%,#1F4F27 100%);flex-shrink:0;">
    <div style="position:absolute;top:20px;left:20px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div style="position:absolute;bottom:18px;left:22px;background:rgba(255,255,255,.95);color:#1F7D45;font-size:12px;font-weight:800;padding:6px 14px;border-radius:100px;">Gratis</div>
  </div>

  <div style="flex:1;padding:22px 22px;overflow:hidden;">
    <div style="font-size:23px;font-weight:800;margin-bottom:12px;">Feria de artesanos costaneros</div>

    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span style="font-size:13px;">Hoy, 12 de septiembre · 20:00 a 23:00</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span style="font-size:13px;">Costanera Sur, frente al muelle</span>
      </div>
    </div>

    <div style="font-size:14px;line-height:1.6;color:#3A4548;margin-bottom:22px;">
      Puestos de artesanos locales sobre la costanera, con música en vivo y feria de comidas.
      Actividad al aire libre, apta para toda la familia.
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:#0B6E8C;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        Guardar con recordatorio
      </button>
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:#F1EDE4;color:#1F2A2E;font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Cómo llegar
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
