<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#C6402F} a:hover{color:#9E3025}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FBF6EF;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#2A211C;">

  <div style="padding:20px 20px 12px;">
    <div style="background:#FFFFFF;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7A6E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <span style="font-size:14px;color:#8A7A6E;font-weight:600;">Buscar en la ciudad</span>
    </div>
  </div>

  <div style="padding:0 20px 12px;display:flex;gap:8px;overflow:hidden;">
    <div style="padding:7px 14px;border-radius:100px;background:#C6402F;color:#FFFFFF;font-size:12px;font-weight:700;white-space:nowrap;">Todos</div>
    <div style="padding:7px 14px;border-radius:100px;background:#FFFFFF;color:#5A4A40;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid #EBDFD2;">Gastronomía</div>
    <div style="padding:7px 14px;border-radius:100px;background:#FFFFFF;color:#5A4A40;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid #EBDFD2;">Ferretería</div>
  </div>

  <div style="padding:0 20px 14px;">
    <div style="display:inline-flex;align-items:center;gap:8px;background:#EFF5F0;padding:7px 14px;border-radius:100px;">
      <div style="width:14px;height:14px;border-radius:4px;background:#4C8C6B;"></div>
      <span style="font-size:12px;font-weight:700;color:#2F5C46;">Abierto ahora</span>
    </div>
  </div>

  <div style="flex:1;padding:0 20px;overflow:hidden;display:flex;flex-direction:column;gap:12px;">

    <div style="background:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <div style="width:56px;height:56px;border-radius:12px;background:#7A5C3E;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:14px;font-weight:800;">Ferretería El Tornillo</span>
          <span style="font-size:12px;color:#8A7A6E;font-weight:700;">300 m</span>
        </div>
        <div style="font-size:12px;color:#4C8C6B;font-weight:700;margin:2px 0;">Ferretería · Abierto</div>
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#D9A544" stroke="#D9A544"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
          <span style="font-size:12px;font-weight:700;">4,6</span>
          <span style="font-size:11px;color:#8A7A6E;">(38)</span>
        </div>
        <div style="display:inline-block;background:#FBEFE4;color:#C6402F;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;">PROMO 15% en pinturas</div>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <div style="width:56px;height:56px;border-radius:12px;background:#D9822B;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:14px;font-weight:800;">Panadería La Unión</span>
          <span style="font-size:12px;color:#8A7A6E;font-weight:700;">450 m</span>
        </div>
        <div style="font-size:12px;color:#B8863A;font-weight:700;margin:2px 0;">Gastronomía · Cierra 12:30</div>
        <div style="display:flex;align-items:center;gap:4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#D9A544" stroke="#D9A544"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
          <span style="font-size:12px;font-weight:700;">4,8</span>
          <span style="font-size:11px;color:#8A7A6E;">(112)</span>
        </div>
      </div>
    </div>

  </div>

  <div style="height:78px;background:#FFFFFF;border-top:1px solid #EFE4D6;display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#C6402F;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <span style="font-size:11px;font-weight:700;">Buscar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B8AA9C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      <span style="font-size:11px;font-weight:600;">Promos</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B8AA9C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/></svg>
      <span style="font-size:11px;font-weight:600;">Mapa</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B8AA9C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      <span style="font-size:11px;font-weight:600;">Yo</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
