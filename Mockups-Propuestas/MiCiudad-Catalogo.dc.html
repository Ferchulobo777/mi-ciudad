<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;} *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:700;white-space:nowrap;}
  .card{background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FBF7F0;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <div style="padding:22px 20px 14px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <div style="font-size:20px;font-weight:800;">Catálogo</div>
    </div>
    <div style="background:#FFFFFF;border:1.5px solid #E4DDD0;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6ADA6" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <span style="font-size:13px;color:#A6ADA6;">Buscar un lugar...</span>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:0 20px 14px;overflow:hidden;">
    <div class="chip" style="background:#0B6E8C;color:#FFFFFF;">Todos</div>
    <div class="chip" style="background:#E9F3F6;color:#3AA0C4;">Playas</div>
    <div class="chip" style="background:#EDF6F4;color:#2E9E8F;">Termas</div>
    <div class="chip" style="background:#F1E7DE;color:#8E5A4A;">Museos</div>
    <div class="chip" style="background:#FBEEE0;color:#D9822B;">Gastro</div>
  </div>

  <div style="padding:0 20px 8px;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:12px;color:#5C6B6E;">24 lugares</span>
    <span style="font-size:12px;font-weight:700;color:#0B6E8C;display:flex;align-items:center;gap:4px;">
      Ordenar: distancia
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
  </div>

  <div style="flex:1;padding:8px 20px 0;overflow:hidden;display:flex;flex-direction:column;gap:10px;">
    <div class="card">
      <div style="width:44px;height:44px;border-radius:10px;background:#3AA0C4;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">Playa Paso Vela</div>
        <div style="font-size:12px;color:#5C6B6E;">Playas · Gratis</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#0B6E8C;">1,1 km</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#D96C3F" stroke="#D96C3F" stroke-width="1.5" style="flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    </div>
    <div class="card">
      <div style="width:44px;height:44px;border-radius:10px;background:#2E9E8F;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">Termas de Colón</div>
        <div style="font-size:12px;color:#5C6B6E;">Termas · Abierto ahora</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#0B6E8C;">900 m</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#D96C3F" stroke="#D96C3F" stroke-width="1.5" style="flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    </div>
    <div class="card">
      <div style="width:44px;height:44px;border-radius:10px;background:#8E5A4A;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">Molino Forclaz</div>
        <div style="font-size:12px;color:#5C6B6E;">Museos y patrimonio</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#0B6E8C;">4,2 km</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#D96C3F" stroke="#D96C3F" stroke-width="1.5" style="flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    </div>
    <div class="card">
      <div style="width:44px;height:44px;border-radius:10px;background:#D9822B;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">Costanera Sur</div>
        <div style="font-size:12px;color:#5C6B6E;">Naturaleza</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#0B6E8C;">2,0 km</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#D96C3F" stroke="#D96C3F" stroke-width="1.5" style="flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    </div>
    <div class="card" style="opacity:.5;">
      <div style="width:44px;height:44px;border-radius:10px;background:#3B5BA5;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">Hostería del Río</div>
        <div style="font-size:12px;color:#5C6B6E;">Alojamiento · Cerrado</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#0B6E8C;">3,4 km</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A6ADA6" stroke-width="2" style="flex-shrink:0;"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
