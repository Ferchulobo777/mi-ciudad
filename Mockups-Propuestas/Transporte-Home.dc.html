<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#16528C} a:hover{color:#0F3A63}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#F4F5F7;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1A2233;">

  <!-- Header -->
  <div style="padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between;background:#16528C;">
    <span style="font-size:20px;font-weight:800;color:#FFFFFF;">Paraná</span>
    <div style="width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </div>
  </div>

  <div style="flex:1;padding:16px 18px;overflow:hidden;display:flex;flex-direction:column;gap:14px;">

    <!-- Tus paradas -->
    <div style="background:#FFFFFF;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <div style="font-size:13px;font-weight:700;color:#5A6478;margin-bottom:10px;">Tus paradas</div>
      <div style="font-size:14px;font-weight:800;margin-bottom:8px;">Alameda y Urquiza <span style="font-weight:600;color:#5A6478;">· a 120 m</span></div>
      <div style="display:flex;gap:10px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:22px;height:22px;border-radius:6px;background:#1B6CA8;color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;">5</span>
          <span style="font-size:13px;font-weight:700;">10:42</span>
          <span style="font-size:12px;color:#8A94A8;">11:02 · 11:22</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:22px;height:22px;border-radius:6px;background:#C1440E;color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;">14</span>
          <span style="font-size:13px;font-weight:700;">10:51</span>
          <span style="font-size:12px;color:#8A94A8;">11:21 · 11:51</span>
        </div>
      </div>
    </div>

    <!-- Avisos -->
    <div style="background:#FFF7E5;border:1px solid #F2B705;border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8860B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div>
        <div style="font-size:13px;font-weight:800;color:#3A2F00;">L2 · L7 · L9 — desvío por obra</div>
        <div style="font-size:12px;color:#5A4E1E;">en calle Corrientes</div>
      </div>
    </div>

    <!-- Mapa -->
    <div style="flex:1;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(155deg,#16528C 0%,#0F3A63 100%);min-height:220px;">
      <svg width="100%" height="100%" viewBox="0 0 350 220" style="position:absolute;inset:0;opacity:.4;">
        <path d="M0,60 L350,60" stroke="#F2B705" stroke-width="4"/>
        <path d="M0,140 L350,140" stroke="#FFFFFF" stroke-width="2"/>
        <path d="M120,0 L120,220" stroke="#FFFFFF" stroke-width="2"/>
      </svg>
      <div style="position:absolute;left:112px;top:52px;width:16px;height:16px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 5px rgba(242,183,5,.3);"></div>
      <div style="position:absolute;left:175px;top:190px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;border:3px solid #16528C;"></div>
    </div>

  </div>

  <!-- Bottom tabs -->
  <div style="height:78px;background:#FFFFFF;border-top:1px solid #E7E9EE;display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#16528C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>
      <span style="font-size:11px;font-weight:700;">Líneas</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A7AFC0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size:11px;font-weight:600;">Paradas</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A7AFC0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>
      <span style="font-size:11px;font-weight:600;">Avisos</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A7AFC0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      <span style="font-size:11px;font-weight:600;">Yo</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
