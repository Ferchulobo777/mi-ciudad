<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;} *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
  .campo{background:#FFFFFF;border:1.5px solid #E4DDD0;border-radius:12px;padding:14px 16px;font-size:14px;color:#1F2A2E;}
  .label{font-size:12px;font-weight:700;color:#5C6B6E;margin-bottom:6px;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FBF7F0;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <div style="padding:28px 26px 10px;">
    <div style="width:36px;height:36px;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:26px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F2A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div style="font-size:26px;font-weight:800;">Crear cuenta</div>
    <div style="font-size:13px;color:#5C6B6E;margin-top:6px;">Guardá tus favoritos y tu recorrido entre dispositivos.</div>
  </div>

  <div style="padding:20px 26px;display:flex;flex-direction:column;gap:16px;">
    <div>
      <div class="label">Nombre</div>
      <div class="campo">Nombre y apellido</div>
    </div>
    <div>
      <div class="label">Correo electrónico</div>
      <div class="campo">turista@correo.com</div>
    </div>
    <div>
      <div class="label">Contraseña</div>
      <div class="campo">••••••••</div>
    </div>

    <button style="all:unset;margin-top:8px;display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;background:#0B6E8C;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;">Crear cuenta</button>
  </div>

  <div style="margin-top:auto;padding:24px 26px 32px;text-align:center;font-size:13px;color:#5C6B6E;">
    ¿Ya tenés cuenta? <span style="color:#0B6E8C;font-weight:700;">Ingresá</span>
  </div>

</div>
</x-dc>
</body>
</html>
