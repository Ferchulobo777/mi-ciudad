<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;} *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
  .card{background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FBF7F0;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <div style="background:#3A4450;color:#FFFFFF;padding:10px 20px;display:flex;align-items:center;gap:8px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.7 16.7a10 10 0 01-11.4 0M5 12.6a13 13 0 0114 0M8.5 15.5a8 8 0 017 0"/></svg>
    <span style="font-size:12px;font-weight:700;">Sin conexión · mostrando datos guardados</span>
  </div>

  <div style="padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;">
      <span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#0B6E8C;text-transform:uppercase;">Mi Ciudad</span>
      <span style="font-size:22px;font-weight:800;">Colón</span>
    </div>
    <div style="width:40px;height:40px;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);opacity:.5;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </div>
  </div>

  <div style="flex:1;padding:8px 20px 0;overflow:hidden;">

    <div style="background:#FBEEE0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9962C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 11-2.1-9.4L23 10"/></svg>
      <span style="font-size:12px;font-weight:700;color:#8A5F1B;">1 visita esperando para sincronizar</span>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:10px;">Cerca tuyo (guardado)</div>
    <div style="display:flex;flex-direction:column;gap:10px;">

      <div class="card">
        <div style="width:40px;height:40px;border-radius:10px;background:#8E5A4A;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Molino Forclaz</div>
          <div style="font-size:12px;color:#5C6B6E;">Museos y patrimonio</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6ADA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 11-2.1-9.4L23 10"/></svg>
      </div>

      <div class="card">
        <div style="width:40px;height:40px;border-radius:10px;background:#3AA0C4;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Playa Paso Vela</div>
          <div style="font-size:12px;color:#5C6B6E;">Playas</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6ADA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 11-2.1-9.4L23 10"/></svg>
      </div>

      <div class="card" style="opacity:.5;">
        <div style="width:40px;height:40px;border-radius:10px;background:#2E9E8F;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Termas de Colón</div>
          <div style="font-size:12px;color:#5C6B6E;">Audioguía no descargada</div>
        </div>
      </div>

    </div>
  </div>

  <div style="height:78px;background:#FFFFFF;border-top:1px solid #EFEAE0;display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;flex-shrink:0;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#0B6E8C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><line x1="9" y1="7" x2="9" y2="20"/><line x1="15" y1="7" x2="15" y2="20"/></svg>
      <span style="font-size:11px;font-weight:700;">Mapa</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span style="font-size:11px;font-weight:600;">Agenda</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="19" r="2"/><path d="M7 19h6a4 4 0 000-8H9a4 4 0 010-8h8"/><circle cx="19" cy="3" r="2"/></svg>
      <span style="font-size:11px;font-weight:600;">Mi recorrido</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      <span style="font-size:11px;font-weight:600;">Yo</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
