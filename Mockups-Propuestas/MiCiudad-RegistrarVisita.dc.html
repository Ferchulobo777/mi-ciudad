<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;} *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
  .opcion{background:#FFFFFF;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:rgba(31,42,46,.55);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative;color:#1F2A2E;">

  <div style="background:#FBF7F0;border-radius:24px 24px 0 0;padding:14px 22px 30px;">
    <div style="width:40px;height:4px;border-radius:2px;background:#E4DDD0;margin:0 auto 18px;"></div>
    <div style="font-size:19px;font-weight:800;margin-bottom:4px;">Registrar visita</div>
    <div style="font-size:13px;color:#5C6B6E;margin-bottom:18px;">Molino Forclaz</div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
      <div class="opcion" style="border:2px solid #0B6E8C;">
        <div style="width:44px;height:44px;border-radius:12px;background:#E9F3F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="21" y2="14"/><line x1="14" y1="21" x2="21" y2="21"/><line x1="17.5" y1="14" x2="17.5" y2="21"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Escanear código QR</div>
          <div style="font-size:12px;color:#5C6B6E;">El cartel en la entrada del lugar</div>
        </div>
      </div>
      <div class="opcion">
        <div style="width:44px;height:44px;border-radius:12px;background:#EDF6F4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3F7D45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Por cercanía</div>
          <div style="font-size:12px;color:#5C6B6E;">Usando tu ubicación actual</div>
        </div>
      </div>
      <div class="opcion">
        <div style="width:44px;height:44px;border-radius:12px;background:#FBEEE0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D96C3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Cargar manual</div>
          <div style="font-size:12px;color:#5C6B6E;">Si no tenés señal ni QR a mano</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:18px;">
      <div style="flex:1;height:84px;border-radius:12px;border:2px dashed #C9BEA8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8A8070;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span style="font-size:11px;font-weight:700;">Sacar foto</span>
      </div>
      <div style="flex:2;background:#FFFFFF;border:1.5px solid #E4DDD0;border-radius:12px;padding:12px 14px;font-size:13px;color:#A6ADA6;">Nota (opcional)</div>
    </div>

    <button style="all:unset;display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;background:#0B6E8C;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;">Registrar visita</button>
    <div style="text-align:center;font-size:11px;color:#5C6B6E;margin-top:12px;">Sin señal, se guarda en tu teléfono y se sube solo cuando vuelva la conexión.</div>
  </div>

</div>
</x-dc>
</body>
</html>
