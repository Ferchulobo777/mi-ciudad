<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  a{color:#0B6E8C} a:hover{color:#084C63}
  *{box-sizing:border-box;}
  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}
</style>
</helmet>
<div class="fnt" style="width:390px;height:844px;background:#FBF7F0;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1F2A2E;">

  <!-- Header -->
  <div style="padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;">
      <span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#0B6E8C;text-transform:uppercase;">Mi Ciudad</span>
      <span style="font-size:22px;font-weight:800;">Colón</span>
    </div>
    <div style="width:40px;height:40px;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E8C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </div>
  </div>

  <!-- Map card -->
  <div style="margin:0 20px;height:260px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(160deg,#0B6E8C 0%,#3F7D45 100%);">
    <svg width="100%" height="100%" viewBox="0 0 350 260" style="position:absolute;inset:0;opacity:.35;">
      <path d="M0,180 C80,140 120,210 200,160 C260,120 300,170 350,140" stroke="#FBF7F0" stroke-width="3" fill="none"/>
      <path d="M0,80 C60,60 140,100 220,60 C280,30 320,60 350,40" stroke="#FBF7F0" stroke-width="2" fill="none" opacity=".6"/>
    </svg>
    <!-- pins -->
    <div style="position:absolute;left:150px;top:110px;width:26px;height:26px;border-radius:50% 50% 50% 0;background:#D96C3F;transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,.25);"></div>
    <div style="position:absolute;left:220px;top:70px;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#FBF7F0;transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,.25);"></div>
    <div style="position:absolute;left:90px;top:150px;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#FBF7F0;transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,.25);"></div>
    <!-- vos estas aca -->
    <div style="position:absolute;left:175px;top:190px;width:16px;height:16px;border-radius:50%;background:#FBF7F0;border:3px solid #0B6E8C;box-shadow:0 0 0 6px rgba(251,247,240,.35);"></div>
  </div>

  <!-- Cerca tuyo -->
  <div style="flex:1;padding:18px 20px 0;overflow:hidden;">
    <div style="font-size:15px;font-weight:700;margin-bottom:10px;">Cerca tuyo</div>
    <div style="display:flex;flex-direction:column;gap:10px;">

      <div style="background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);">
        <div style="width:40px;height:40px;border-radius:10px;background:#8E5A4A;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Termas de Colón</div>
          <div style="font-size:12px;color:#5C6B6E;">Termas · Abierto ahora</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#0B6E8C;">900 m</div>
      </div>

      <div style="background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);">
        <div style="width:40px;height:40px;border-radius:10px;background:#3AA0C4;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Playa Paso Vela</div>
          <div style="font-size:12px;color:#5C6B6E;">Playas</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#0B6E8C;">1,1 km</div>
      </div>

      <div style="background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);">
        <div style="width:40px;height:40px;border-radius:10px;background:#8E5A4A;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">Museo Casa de la Cultura</div>
          <div style="font-size:12px;color:#5C6B6E;">Museos y patrimonio</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#0B6E8C;">1,4 km</div>
      </div>

    </div>
  </div>

  <!-- Bottom tabs -->
  <div style="height:78px;background:#FFFFFF;border-top:1px solid #EFEAE0;display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#0B6E8C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><line x1="9" y1="7" x2="9" y2="20"/><line x1="15" y1="7" x2="15" y2="20"/></svg>
      <span style="font-size:11px;font-weight:700;">Mapa</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span style="font-size:11px;font-weight:600;">Agenda</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="19" r="2"/><path d="M7 19h6a4 4 0 000-8H9a4 4 0 010-8h8"/><circle cx="19" cy="3" r="2"/></svg>
      <span style="font-size:11px;font-weight:600;">Mi recorrido</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A6ADA6;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      <span style="font-size:11px;font-weight:600;">Yo</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
