<body>

<helmet>

  .fnt{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}

<div class="fnt" style="width:390px;height:844px;background:#F2F7F2;display:flex;flex-direction:column;overflow:hidden;position:relative;color:#1B2420;">

        <rect x="10" y="110" width="30" height="30" fill="#1B2420"/><rect x="18" y="118" width="14" height="14" fill="#FFFFFF"/><rect x="22" y="122" width="6" height="6" fill="#1B2420"/>
        <rect x="55" y="15" width="8" height="8" fill="#1B2420"/><rect x="70" y="15" width="8" height="8" fill="#1B2420"/><rect x="85" y="25" width="8" height="8" fill="#1B2420"/>

      </svg>
      <div style="font-size:13px;color:#6B7A70;font-weight:600;margin-top:14px;">Mostráselo al encargado</div>
    </div>

    <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:#F1EFE9;color:#1B2420;font-size:14px;font-weight:700;margin-bottom:10px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>

    <button style="all:unset;display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:14px;border:2px solid #C24C4C;color:#C24C4C;font-size:14px;font-weight:700;">Cancelar reserva</button>
    <div style="text-align:center;font-size:11px;color:#8A948E;margin-top:8px;">Se puede cancelar sin aviso hasta las 15:00 de hoy</div>

  </div>
