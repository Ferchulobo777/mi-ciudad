appId: com.miciudad.app
---
# Flujo sin sesión iniciada: del Inicio (mapa + "Cerca") al Catálogo con el
# buscador, de ahí al Detalle de un lugar, y confirma que "Agregar a
# favoritos" exige iniciar sesión (la cuenta es para guardar cosas, según el
# PRD), en vez de intentar marcar el favorito directamente. Se evita depender
# del estado guardado en SQLite (favorito ya marcado o no) para que el flujo dé
# el mismo resultado sin importar cuántas veces se haya corrido antes.
- launchApp
- assertVisible: "Colón"
- tapOn: "Buscar un lugar"
- assertVisible: "Catálogo"
- inputText: "termas"
- tapOn: "Termas de Colón.*"
- assertVisible: "Cómo llegar"
- tapOn: "Agregar a favoritos"
- assertVisible: "Ingresar"
- tapOn: "Seguir sin cuenta"
- assertVisible: "Cómo llegar"
